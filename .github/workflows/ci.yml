name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Check database
        run: node -e "const db = JSON.parse(require('fs').readFileSync('db.json', 'utf8')); const p = db.prospects || []; console.log('Prospects:', p.length); if (p.length === 0) process.exit(1);"

      - name: Check templates
        run: node -e "const t = JSON.parse(require('fs').readFileSync('data/all-email-templates.json', 'utf8')); console.log('Templates:', (t.templates || []).length); if (!t.templates || t.templates.length === 0) process.exit(1);"

      - name: Check domains
        run: node -e "const d = JSON.parse(require('fs').readFileSync('data/disposable-domains.json', 'utf8')); console.log('Domains:', (d.domains || []).length); if (!d.domains || d.domains.length === 0) process.exit(1);"
